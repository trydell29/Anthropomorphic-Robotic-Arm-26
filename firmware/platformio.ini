; ARA - Anthropomorphic Robotic Arm
; Firmware for the on-arm ESP32.
;
; Board: change `board` below if you are not on a generic DevKit v1.
;   esp32dev        generic ESP32 DevKit / WROOM-32   <- default
;   esp32-s3-devkitc-1
;   nodemcu-32s
;   Full list: https://docs.platformio.org/en/latest/boards/index.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.2
    gin66/FastAccelStepper @ ^0.31.5
    ESP32Async/AsyncTCP @ ^3.3.2
    ESP32Async/ESPAsyncWebServer @ ^3.6.0

; NOTE ON THE ASYNC WEB SERVER
; This library has forked several times. ESP32Async/* is the currently
; maintained line. If the build fails to resolve it, the alternatives are
; mathieucarbou/ESPAsyncWebServer or esphome/ESPAsyncWebServer-esphome.
; Pick ONE AsyncTCP and ONE web server -- having two in lib_deps produces
; duplicate-symbol link errors that look unrelated to the real cause.
;
; TMCStepper is deliberately NOT included. The two stepper axes use
; different driver ICs (elbow ext: Adafruit TMC2209 PID 6121; roll: Adafruit
; A4988 PID 6109), both driven in plain STEP/DIR mode via GPIO EN lines --
; the TMC2209 is standalone with PDN/UART left floating, no UART config
; needed. Add teemuatlut/TMCStepper only if you later want runtime current
; control or stallguard homing on the TMC2209.